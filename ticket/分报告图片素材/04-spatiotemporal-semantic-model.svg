<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><style>.t,.s{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#27313A}.s{font-weight:400;fill:#65717C}.cap{font-family:'Microsoft YaHei',sans-serif;fill:#245B92;font-weight:600}.section{font-family:'Microsoft YaHei',sans-serif;fill:#FFFFFF;font-weight:600}</style></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="800" y="62" text-anchor="middle" class="t" font-size="36" font-weight="600">工作票与监控视频的时空—语义综合关联模型</text><text x="800" y="96" text-anchor="middle" class="s" font-size="18">时间解决“什么时候”，空间解决“看哪里”，语义解决“是不是这项工作”</text><rect x="110" y="155" width="360" height="58" rx="8" fill="#4B91E8"/><text x="290" y="193" text-anchor="middle" class="section" font-size="24">时间关联</text><rect x="145" y="245" width="290" height="64" rx="14" fill="#E7F1FD" stroke="#4B91E8" stroke-width="2.5"/><text x="290" y="277" text-anchor="middle" class="t" font-size="19" font-weight="600">计划开始/结束时间</text><rect x="145" y="337" width="290" height="64" rx="14" fill="#E7F1FD" stroke="#4B91E8" stroke-width="2.5"/><text x="290" y="369" text-anchor="middle" class="t" font-size="19" font-weight="600">许可与终结时间</text><rect x="145" y="429" width="290" height="64" rx="14" fill="#E7F1FD" stroke="#4B91E8" stroke-width="2.5"/><text x="290" y="461" text-anchor="middle" class="t" font-size="19" font-weight="600">录像时间</text><rect x="145" y="521" width="290" height="64" rx="14" fill="#E7F1FD" stroke="#4B91E8" stroke-width="2.5"/><text x="290" y="553" text-anchor="middle" class="t" font-size="19" font-weight="600">事件发生时间</text><path d="M 290 613 L 290 650 L 800 650 L 800 695" fill="none" stroke="#4B91E8" stroke-width="3"  marker-end="url(#arr)"/><rect x="570" y="155" width="360" height="58" rx="8" fill="#62B456"/><text x="750" y="193" text-anchor="middle" class="section" font-size="24">空间关联</text><rect x="605" y="245" width="290" height="64" rx="14" fill="#EAF6E8" stroke="#62B456" stroke-width="2.5"/><text x="750" y="277" text-anchor="middle" class="t" font-size="19" font-weight="600">变电站或线路</text><rect x="605" y="337" width="290" height="64" rx="14" fill="#EAF6E8" stroke="#62B456" stroke-width="2.5"/><text x="750" y="369" text-anchor="middle" class="t" font-size="19" font-weight="600">作业区域与设备位置</text><rect x="605" y="429" width="290" height="64" rx="14" fill="#EAF6E8" stroke="#62B456" stroke-width="2.5"/><text x="750" y="461" text-anchor="middle" class="t" font-size="19" font-weight="600">摄像机点位</text><rect x="605" y="521" width="290" height="64" rx="14" fill="#EAF6E8" stroke="#62B456" stroke-width="2.5"/><text x="750" y="553" text-anchor="middle" class="t" font-size="19" font-weight="600">监控覆盖范围</text><path d="M 750 613 L 750 650 L 800 650 L 800 695" fill="none" stroke="#62B456" stroke-width="3"  marker-end="url(#arr)"/><rect x="1030" y="155" width="360" height="58" rx="8" fill="#E49B3F"/><text x="1210" y="193" text-anchor="middle" class="section" font-size="24">语义关联</text><rect x="1065" y="245" width="290" height="64" rx="14" fill="#FFF3DF" stroke="#E49B3F" stroke-width="2.5"/><text x="1210" y="277" text-anchor="middle" class="t" font-size="19" font-weight="600">工作内容与作业类型</text><rect x="1065" y="337" width="290" height="64" rx="14" fill="#FFF3DF" stroke="#E49B3F" stroke-width="2.5"/><text x="1210" y="369" text-anchor="middle" class="t" font-size="19" font-weight="600">目标设备与工具</text><rect x="1065" y="429" width="290" height="64" rx="14" fill="#FFF3DF" stroke="#E49B3F" stroke-width="2.5"/><text x="1210" y="461" text-anchor="middle" class="t" font-size="19" font-weight="600">人员及作业行为</text><rect x="1065" y="521" width="290" height="64" rx="14" fill="#FFF3DF" stroke="#E49B3F" stroke-width="2.5"/><text x="1210" y="553" text-anchor="middle" class="t" font-size="19" font-weight="600">视频场景描述</text><path d="M 1210 613 L 1210 650 L 800 650 L 800 695" fill="none" stroke="#E49B3F" stroke-width="3"  marker-end="url(#arr)"/><rect x="585" y="695" width="430" height="90" rx="14" fill="#E7F1FD" stroke="#4B91E8" stroke-width="2.5"/><text x="800" y="730" text-anchor="middle" class="t" font-size="24" font-weight="600">综合关联判断</text><text x="800" y="767" text-anchor="middle" class="s" font-size="18">候选筛选、关联评分、业务规则校验</text><path d="M 800 785 L 800 825" fill="none" stroke="#4B91E8" stroke-width="3"  marker-end="url(#arr)"/><rect x="375" y="825" width="850" height="54" rx="12" fill="#EAF6E8" stroke="#62B456" stroke-width="2.5"/><text x="800" y="859" text-anchor="middle" class="t" font-size="22" font-weight="600">关联摄像机　|　视频片段　|　关键帧　|　关联依据　|　人工复核状态</text></svg>